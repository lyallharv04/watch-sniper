########################################################################
#  Blacklist regression corpus.
#
#  `drop = true`  means the blacklist SHOULD fire on this title.
#  `drop = false` means it must NOT — these are the false positives, and they
#  are the reason the matcher is negation-aware at all.
#
#  The entries below the marker are seeds carried over from the previous
#  attempt: real titles, or minimal reproductions of real failures. Everything
#  ADDED from here on should come from a listing the operator actually
#  labelled in the dashboard as a bad rejection or a bad pass. A hand-authored
#  corpus measures the author's imagination; a corpus grown from labelled
#  traffic measures the system.
########################################################################

[[case]]
title = "Hamilton Khaki Field Mechanical 38mm - water resistance untested"
drop = false
why = "THE critical false positive. Boilerplate on most vintage listings."

[[case]]
title = "Vintage Seiko - untested, sold as seen"
drop = true
why = "Bare untested means the movement."

