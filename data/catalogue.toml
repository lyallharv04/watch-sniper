########################################################################
#  FMV CATALOGUE — the project's critical path.
#
#  Every number in this file is an UNVERIFIED ESTIMATE written by an AI.
#  None of them is a comp. Until `verified` is flipped on a row, every
#  valuation derived from it is labelled unverified in the dashboard and in
#  every notification, and you should treat it as a prompt to look, not as a
#  price.
#
#  WHAT `fmv` MEANS
#  The realistic UK used sale price achievable within about 30 days for a
#  MINT example. The condition multiplier in config.py only ever adjusts it
#  downward.
#
#  `fmv_low` / `fmv_high` (optional)
#  Where a title genuinely cannot tell you which variant you are looking at,
#  give the band instead of pretending to a point. The valuation then uses the
#  MIDPOINT of the band and ignores `fmv` for that entry — edit the band, not
#  `fmv`. Omit both when the reference is unambiguous; they then default to
#  `fmv`.
#
#  HOW TO CURATE THIS  (requirement 22 — make it a sitting, not a chore)
#    1.  `python -m watchsniper catalogue`  prints these rows ordered by how
#        many real listings each one has actually priced. Work down that list;
#        the top ten rows cover most of the traffic and the tail can wait.
#    2.  For each row: find what that reference actually SOLD for on eBay UK in
#        the last 90 days (signed in, Sold filter), take a median of the
#        genuine Buy It Now and auction sales, ignore Best Offer rows because
#        eBay shows the asking price on those and it biases you upward.
#    3.  Edit `fmv`, set `verified = true`, put the date and your sample size
#        in `notes`.
#    4.  `python -m watchsniper rescore`  re-scores every listing already
#        captured, offline and free. You immediately see what your new number
#        would have done to two weeks of real traffic.
#
#  MATCHING FIELDS
#    aliases       any one of these appearing in the title makes the entry a
#                  candidate. Each must be distinctive ON ITS OWN — `integra`
#                  is a substring of `integrated`, and that once priced a £175
#                  Tissot as a £520 Farer.
#    requires_any  if present, at least one must also appear. This is what
#                  keeps a quartz from being priced as an automatic.
#    excludes      any one of these appearing disqualifies the entry.
#    priority      10 = a specific variant. 0 = a catch-all that should only
#                  win when no variant matched.
#    synthetic_key = true means `key` is our invention, not a manufacturer
#                  reference. Declared, never inferred from the string shape:
#                  Sinn's real `556-I` and our invented `C60-TRIDENT-PRO-300`
#                  are the same shape and opposite in meaning.
########################################################################

as_of = "2026-09-04"
source = "Inherited seed estimates from the V2.0 attempt. Nothing verified."

